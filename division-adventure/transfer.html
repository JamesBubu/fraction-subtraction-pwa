<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>換個故事，再試一次</title><style>body{font:20px system-ui;background:#f3f6eb;color:#203f37;margin:0}main{max-width:720px;margin:auto;padding:28px}select{max-width:100%}button,input,select{font:inherit;min-height:48px;border:2px solid #547568;border-radius:12px;padding:8px;margin:8px 0}button{background:#225f4e;color:white;cursor:pointer}section{background:white;padding:24px;border-radius:24px}label{display:block;margin:18px 0}input{width:130px}#feedback{line-height:1.7}a{color:#225f4e}</style><main><a href="index.html">← 回到小島</a><h1>換個故事，再試一次</h1><p>約 3 分鐘。不計時。先填數字，再選理由；需要提示也沒關係。</p><section><h2 id="question"></h2><form id="form"><label>我的答案 <input id="answer" inputmode="numeric" required autocomplete="off"><span id="unit"></span></label><label>我的理由<select id="reason" required><option value="">請選理由</option></select></label><button>檢查我的想法</button></form><button id="hint">給我一點線索</button><p id="feedback" role="status"></p><button id="next" hidden>換個任務</button></section><p id="progress"></p><script>
const tasks=[{q:'有 875 元，每瓶果汁 24 元，最多可以買幾瓶？',u:'瓶',a:36,r:['剩下的錢不夠再買一瓶','只要有餘數就多買一瓶','餘數就是瓶數'],h:['多買一瓶，錢還夠嗎？','比較 24×36 與 24×37。','24×36＝864，剩11元；37瓶要888元。'],ex:'875＝24×36＋11。11元不夠買24元的一瓶。'}, {q:'一本書有 715 頁，每天最多讀 28 頁，至少需要幾天讀完？',u:'天',a:26,r:['剩下的頁數仍需要另一天讀','有餘數也只能取商','餘數就是天數'],h:['最後剩下的頁數，需要讀嗎？','25天讀700頁，還剩15頁。','第26天讀剩下15頁，才讀完。'],ex:'715＝28×25＋15。第26天讀完剩下15頁。'}, {q:'每顆水餃做 14 秒。連續做了 369 秒，要再完成下一顆，還需要幾秒？',u:'秒',a:9,r:['用每顆的秒數減掉下一顆已做的秒數','用完成顆數減餘數','餘數就是還差的秒數'],h:['餘數代表已做，還是還差？','369＝14×26＋5，下一顆已做5秒。','14−5＝9秒。不能用26顆減5秒。'],ex:'369＝14×26＋5；14−5＝9秒。'}, {q:'每天存 45 元，存到 1260 元需要幾星期？（每天都存）',u:'星期',a:4,r:['先算天數，再每7天換成1星期','除出來的數字直接當星期','把天數乘7'],h:['1260÷45算出什麼單位？','需要28天；每星期7天。','28÷7＝4星期。'],ex:'1260÷45＝28天；28÷7＝4星期。'}];let i=0,tries=0,hints=0;try{i=Number(localStorage.getItem('division-transfer-position'))||0;if(i<0||i>=tasks.length)i=0}catch{}const $=id=>document.getElementById(id);function show(){tries=hints=0;try{hints=Number(localStorage.getItem("division-transfer-hints-"+i))||0;let past=JSON.parse(localStorage.getItem('division-transfer-evidence')||'[]').filter(x=>x.task===i);tries=past.length;hints=Math.max(hints,past.reduce((n,x)=>Math.max(n,x.hints||0),0))}catch{}let t=tasks[i];$('question').textContent=t.q;$('unit').textContent=t.u;$('reason').innerHTML='<option value="">請選理由</option>';t.r.map((r,j)=>{let o=document.createElement('option');o.value=j;o.textContent=r;return o}).sort(()=>Math.random()-.5).forEach(o=>$('reason').append(o));$('form').reset();$('feedback').textContent='';$('next').hidden=true;$('progress').textContent=`任務 ${i+1} / ${tasks.length} · 完成練習不代表已經熟練。`;$('form').querySelector('button').disabled=false} $('hint').onclick=()=>{$('feedback').textContent=tasks[i].h[Math.min(hints++,2)];try{localStorage.setItem('division-transfer-hints-'+i,hints)}catch{}};$('form').onsubmit=e=>{e.preventDefault();let t=tasks[i],numeric=Number($('answer').value)===t.a,reason=$('reason').value==='0',ok=numeric&&reason;tries++;let record={task:i,at:Date.now(),correct:ok,firstIndependent:ok&&tries===1&&hints===0,hints,attempt:tries};try{let log=JSON.parse(localStorage.getItem('division-transfer-evidence')||'[]');log.push(record);localStorage.setItem('division-transfer-evidence',JSON.stringify(log.slice(-100)))}catch{}$('feedback').textContent=ok?`${tries===1&&hints===0?'這題首次獨立答對。':'這題經過練習後答對。'} ${t.ex} 試著用自己的話說一次。`:numeric?'數字對了，再想想理由。不同故事的餘數用途不一樣。':reason?'理由有道理，再檢查計算和答案的單位。':'先想答案的單位，再用乘法檢查；可以點線索，或回小島操作。';if(ok){$('next').hidden=false;$('form').querySelector('button').disabled=true}};$('next').onclick=()=>{i=(i+1)%tasks.length;try{localStorage.setItem('division-transfer-position',i)}catch{}show()};show();</script></main></html>
